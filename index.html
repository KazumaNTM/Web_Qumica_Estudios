<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química General | Chang & Overby 15ª Ed.</title>
<style>
    /* ==================== RESET Y VARIABLES GLOBALES ====================
       Las variables --primary, --primary-dark y --accent-chapter se
       RECALCULAN por JavaScript cada vez que cambias de capítulo (función
       aplicarAcento). Así cada capítulo tiene su propia tonalidad sin que
       tengamos que escribir un CSS distinto para cada uno. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #0f766e;
        --primary-dark: #0d5c56;
        --accent: #f59e0b;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
        --success: #16a34a;
        --danger: #dc2626;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        --sidebar-w: 230px; /* ancho del menú lateral en escritorio */
        /* Estas dos variables reemplazan colores que antes estaban "quemados"
           en el CSS (#f1f5f9 y #f0fdfa). Al pasarlas por variable, el modo
           oscuro (bloque de abajo) puede recolorearlas sin tocar cada regla. */
        --bg-soft: #f1f5f9;  /* fondos suaves: hover del menú, glosario, encabezados de tabla */
        --bg-tint: #f0fdfa;  /* fondo con tinte de color primario: formula-box, capítulo activo */
    }
    /* ==================== MODO OSCURO ====================
       Se activa poniendo el atributo data-theme="dark" en <html> (lo hace
       la función toggleTheme()). Como el resto del CSS ya usa var(--bg),
       var(--card), var(--text), etc., no hace falta reescribir ninguna
       regla: alcanza con redefinir aquí los valores de esas variables. */
    [data-theme="dark"] {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --bg-soft: #1e293b;
        --bg-tint: #16332f;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }
    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.8;
        min-height: 100vh;
        transition: background 0.25s ease, color 0.25s ease; /* transición suave al cambiar de tema */
    }

    /* ==================== TIPOGRAFÍA QUÍMICA ====================
       OJO: antes "line-height: 0" se aplicaba a CUALQUIER <sup>/<sub> del
       documento. Eso rompía el interlineado en cualquier texto de varias
       líneas que tuviera una carga o subíndice suelto (ej. "He2+", "H2O"),
       como pasaba en las tarjetas de memoria: el texto se veía "desordenado"
       porque el navegador colapsaba la altura de esa línea. Ahora los
       sub/sup normales usan un line-height sano, y el line-height:0 (que sí
       hace falta para apilar los dos números de la notación de isótopos)
       queda limitado únicamente a los que están DENTRO de .isotope. */
    sub, sup { font-size: 75%; position: relative; vertical-align: baseline; }
    sup { top: -0.4em; }
    sub { bottom: -0.25em; }

    /* ==================== NOTACIÓN DE ISÓTOPOS ==================== */
    .isotope { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 2px; line-height: 1; font-size: 1em; }
    .isotope sub, .isotope sup { line-height: 0; } /* aquí sí se necesita, para apilar los números */
    .isotope-nums { display: inline-flex; flex-direction: column; justify-content: center; text-align: right; font-size: 0.6em; margin-right: 4px; line-height: 1.2; }
    .isotope-nums span { display: block; }
    .isotope-symbol { font-size: 1em; }

    /* ==================== HEADER GENERAL (ya no lleva el título del capítulo) ==================== */
    #topbar {
        position: sticky; top: 0; z-index: 200; /* header + nav ahora se pegan juntos, como un solo bloque */
    }
    header {
        background: linear-gradient(135deg, var(--primary) 0%, #134e4a 100%);
        color: white; text-align: center; padding: 1.1rem 1rem; box-shadow: var(--shadow);
        display: flex; align-items: center; justify-content: center; gap: 0.8rem;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    header .subtitle { font-size: 0.8rem; opacity: 0.85; font-weight: 400; }
    /* Botón hamburguesa: solo se ve en pantallas angostas (celular) */
    #btnMenu {
        display: none; background: rgba(255,255,255,0.15); border: none; color: white;
        font-size: 1.1rem; padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer;
        position: absolute; left: 0.8rem;
    }
    /* Botones de la derecha del header: QR, búsqueda, logros y modo oscuro.
       Van todos dentro de #headerAcciones para poder alinearlos en fila. */
    #headerAcciones { position: absolute; right: 0.8rem; display: flex; gap: 0.4rem; }
    #btnQR, #btnBuscar, #btnLogros, #btnTema {
        background: rgba(255,255,255,0.15); border: none; color: white;
        font-size: 1.1rem; padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer;
    }
    #btnQR:hover, #btnBuscar:hover, #btnLogros:hover, #btnTema:hover { background: rgba(255,255,255,0.28); }

    /* ==================== MODAL DE QR (panel "Estudiar en el celular") ====================
       Elemento independiente del sistema de pestañas/capítulos: no usa la
       clase "section" ni compite por ids con seccionXXX(), así que nunca
       puede romper la lógica de carga de capítulos. */
    .qr-modal {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        z-index: 999; align-items: center; justify-content: center; padding: 1rem;
    }
    .qr-modal.open { display: flex; }
    .qr-modal-box {
        background: var(--card); border-radius: 12px; padding: 1.5rem; max-width: 320px;
        width: 100%; text-align: center; box-shadow: var(--shadow); position: relative;
    }
    .qr-modal-box h3 { color: var(--primary-dark); margin-bottom: 0.6rem; font-size: 1.1rem; }
    .qr-modal-box p { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.8rem; }
    .qr-modal-box input[type="text"] { width: 100%; margin: 0 0 0.6rem 0; }
    .qr-modal-box img { border-radius: 8px; border: 1px solid var(--border); margin-top: 0.8rem; }
    .qr-modal-close {
        position: absolute; top: 0.6rem; right: 0.8rem; background: none; border: none;
        font-size: 1.2rem; cursor: pointer; color: var(--muted);
    }

    /* ==================== MODAL DE BÚSQUEDA GLOBAL (Ctrl+K) ====================
       Reusa el mismo overlay oscuro que el modal de QR (misma clase .qr-modal
       para el fondo), pero con su propia "caja" más ancha porque necesita
       espacio para listar resultados, no solo un botón y un QR. */
    .search-box {
        background: var(--card); border-radius: 12px; padding: 1.4rem; max-width: 560px;
        width: 100%; max-height: 75vh; display: flex; flex-direction: column;
        box-shadow: var(--shadow);
    }
    #buscarInput {
        width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 8px;
        background: var(--bg); color: var(--text); font-size: 1rem; margin-bottom: 0.8rem;
    }
    #buscarResultados { overflow-y: auto; }
    .search-result {
        padding: 0.8rem 0.9rem; border-radius: 8px; cursor: pointer; margin-bottom: 0.3rem;
        border: 1px solid transparent;
    }
    .search-result:hover { background: var(--bg-soft); border-color: var(--border); }
    .search-result .sr-meta { font-size: 0.75rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .search-result .sr-titulo { font-weight: 600; margin: 0.15rem 0; }
    .search-result .sr-extracto { font-size: 0.82rem; color: var(--muted); }
    .search-vacio { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.9rem; }

    /* ==================== MODAL DE LOGROS ==================== */
    .logros-box {
        background: var(--card); border-radius: 12px; padding: 1.4rem; max-width: 480px;
        width: 100%; max-height: 75vh; overflow-y: auto; text-align: center; box-shadow: var(--shadow);
    }
    .logros-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.8rem; margin: 1rem 0; }
    .logro-item {
        background: var(--bg-soft); border: 2px solid var(--border); border-radius: 10px;
        padding: 0.9rem 0.5rem; opacity: 0.4; transition: all 0.25s ease;
    }
    .logro-item.desbloqueado { opacity: 1; border-color: var(--accent); box-shadow: 0 0 14px rgba(245, 158, 11, 0.25); }
    .logro-item .li-icono { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .logro-item .li-nombre { font-weight: 700; font-size: 0.82rem; margin-bottom: 0.2rem; }
    .logro-item .li-desc { font-size: 0.7rem; color: var(--muted); line-height: 1.3; }

    /* ==================== NOTIFICACIÓN "TOAST" (aviso de logro desbloqueado) ==================== */
    #toast {
        position: fixed; bottom: 1.2rem; right: 1.2rem; background: var(--accent); color: #1a1a1a;
        padding: 0.9rem 1.3rem; border-radius: 10px; box-shadow: var(--shadow); z-index: 1100;
        font-weight: 700; font-size: 0.9rem; transform: translateX(150%); transition: transform 0.35s ease;
        max-width: 280px;
    }
    #toast.show { transform: translateX(0); }

    /* ==================== LAYOUT GENERAL: sidebar + contenido ==================== */
    .layout { display: flex; align-items: flex-start; min-height: calc(100vh - 64px); }

    /* ---- Menú lateral de capítulos ---- */
    #sidebar {
        width: var(--sidebar-w); flex-shrink: 0; background: var(--card);
        border-right: 1px solid var(--border); height: calc(100vh - var(--topbar-h, 64px));
        position: sticky; top: var(--topbar-h, 64px); overflow-y: auto; padding: 0.6rem 0;
    }
    #sidebar h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 0.5rem 1rem; }
    .chap-item {
        display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left;
        background: transparent; border: none; padding: 0.55rem 1rem; cursor: pointer;
        font-size: 0.85rem; color: var(--text); border-left: 3px solid transparent;
    }
    .chap-item:hover { background: var(--bg-soft); }
    .chap-item.active-chap { background: var(--bg-tint); border-left-color: var(--chap-color); font-weight: 700; }
    /* Puntito de color: cada capítulo tiene el suyo (--chap-color), calculado en JS */
    .chap-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--chap-color); flex-shrink: 0; }
    .chap-num { font-weight: 700; color: var(--muted); }

    /* ---- Columna de contenido (tabs + secciones) ---- */
    .content-wrap { flex: 1; min-width: 0; }
    nav#main-nav {
        background: var(--card);
        border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 0.25rem;
        justify-content: center; /* nuevo: centra los botones de pestañas en vez de dejarlos pegados a la izquierda */
        padding: 0.6rem 0.8rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); overflow-x: auto;
    }
    nav#main-nav button {
        background: transparent; border: none; padding: 0.45rem 0.85rem; font-size: 0.82rem;
        font-weight: 600; color: var(--muted); border-radius: 6px; cursor: pointer;
        white-space: nowrap; transition: all 0.2s ease;
    }
    nav#main-nav button:hover { background: var(--bg-soft); color: var(--primary); }
    nav#main-nav button.active-nav { background: var(--primary); color: white; }

    main { max-width: 920px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    section { display: none; animation: fadeIn 0.35s ease; }
    section.active-page { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ==================== COMPONENTES COMUNES (idénticos al capítulo 2 original) ==================== */
    h2 { font-size: 1.45rem; color: var(--primary-dark); margin-bottom: 1.1rem; padding-bottom: 0.4rem; border-bottom: 3px solid var(--primary); text-align: center; }
    h3 { font-size: 1.15rem; color: var(--primary); margin: 1.4rem 0 0.7rem; }
    p, li { margin-bottom: 1rem; }
    ul, ol { padding-left: 1.4rem; margin-bottom: 1.2rem; }
    li { margin-bottom: 0.9rem; line-height: 1.8; }
    strong { color: var(--primary-dark); }

    /* ==================== CITAS Y TOOLTIPS ==================== */
    .citation-tag { position: relative; display: inline-block; cursor: help; font-size: 0.85em; outline: none; }
    .citation-tag sup { font-size: 0.85em; top: -0.4em; color: var(--primary); font-weight: 700; }
    .citation-tag .tooltip-text {
        position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
        background: #1e293b; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem;
        font-weight: 400; white-space: normal; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2); display: none;
        z-index: 500; pointer-events: none; line-height: 1.4; max-width: 320px; text-align: center;
    }
    .citation-tag:hover .tooltip-text, .citation-tag:focus .tooltip-text, .citation-tag.tooltip-active .tooltip-text { display: block; }
    .citation-tag .tooltip-text::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #1e293b; }

    /* ==================== GLOSARIO ==================== */
    .glossary { background: var(--bg-soft); border-radius: 10px; padding: 1.2rem 1.4rem; margin-top: 1.5rem; font-size: 0.9rem; }
    .glossary h4 { margin-bottom: 0.8rem; color: var(--primary-dark); }
    .glossary ol { padding-left: 1.3rem; margin-bottom: 0; }
    .glossary li { margin-bottom: 0.55rem; line-height: 1.55; }

    /* ==================== CAJAS DE FÓRMULA ==================== */
    .formula-box { background: var(--bg-tint); border-left: 5px solid var(--primary); padding: 1rem 1.2rem; margin: 1.2rem 0; border-radius: 0 8px 8px 0; font-family: 'Consolas', 'Courier New', monospace; font-size: 1.05rem; }
    .formula-box .vars { font-family: 'Segoe UI', sans-serif; font-size: 0.9rem; color: var(--muted); margin-top: 0.6rem; }
    .fuente-nota { font-size: 0.9rem; color: var(--muted); }

    /* ==================== CAJAS DE EJEMPLO ==================== */
    .example-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.3rem; box-shadow: var(--shadow); }
    .example-box h4 { color: var(--primary-dark); margin-bottom: 0.7rem; }

    /* ==================== TABLAS ==================== */
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 0.55rem 0.7rem; text-align: left; }
    th { background: var(--bg-soft); color: var(--primary-dark); }

    /* ==================== EJERCICIOS Y TEST ==================== */
    .exercise-item, .test-q { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.3rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }
    input[type="number"], input[type="text"] { padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; margin-right: 0.5rem; margin-top: 0.4rem; }
    button.btn, .exercise-item button, .test-q button, .practice-answer-area button {
        background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px;
        cursor: pointer; font-weight: 600; font-size: 0.88rem; margin-top: 0.4rem;
    }
    button.btn:hover, .exercise-item button:hover, .test-q button:hover { background: var(--primary-dark); }
    .feedback { margin-top: 0.6rem; font-weight: 600; font-size: 0.9rem; min-height: 1.2rem; }
    .feedback.ok { color: var(--success); }
    .feedback.err { color: var(--danger); }
    .test-q label { display: block; padding: 0.4rem 0.6rem; border-radius: 6px; cursor: pointer; margin-bottom: 0.3rem; }
    .test-q label:hover { background: var(--bg-soft); }
    .selected-opt { background: #e0f2fe; }
    .correct-opt { background: #dcfce7 !important; }
    .wrong-opt { background: #fee2e2 !important; }
    /* En modo oscuro los tonos pastel de arriba se ven "lavados": los
       oscurecemos para que sigan siendo legibles sobre fondo oscuro. */
    [data-theme="dark"] .selected-opt { background: #0c4a6e; }
    [data-theme="dark"] .correct-opt { background: #14532d !important; }
    [data-theme="dark"] .wrong-opt { background: #7f1d1d !important; }

    /* ==================== FLASHCARDS ==================== */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .flashcard-container { perspective: 1000px; height: 190px; } /* antes: 160px — un poco más de alto para respuestas de varias líneas */
    .flashcard { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
    .flashcard.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
        position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; padding: 1rem; /* el flex aquí SOLO centra el div .fc-content de abajo */
        font-size: 0.92rem; box-shadow: var(--shadow);
        overflow-y: auto; /* si un capítulo trae un texto más largo, hace scroll en vez de desbordarse */
    }
    /* Este div interno es el que realmente contiene el texto de la tarjeta.
       A propósito NO es flex: usa flujo de bloque normal, igual que un
       párrafo cualquiera del sitio, para que <sup>, <sub> y .isotope se
       lean "corridos" junto al texto (ej. "He2+") en vez de saltar cada
       uno a su propia línea, que es lo que pasaba cuando el flex estaba
       puesto directamente sobre .flashcard-front/.flashcard-back. */
    .fc-content {
        width: 100%; text-align: center; line-height: 1.4; word-break: break-word;
    }
    .fc-content br { content: ""; display: block; margin-top: 0.3rem; } /* un poco de aire entre líneas separadas con <br> */
    .flashcard-front { background: var(--primary); color: white; }
    .flashcard-back { background: var(--card); border: 2px solid var(--primary); transform: rotateY(180deg); }

    /* ==================== MODO PRÁCTICA ==================== */
    .practice-controls { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .practice-answer-area { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .level-badge { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; color: white; margin-bottom: 0.6rem; }
    .level-1 { background: var(--success); }
    .level-2 { background: var(--accent); }
    .level-3 { background: var(--danger); }

    /* ==================== RESPONSIVE / MÓVIL ==================== */
    @media (max-width: 820px) {
        #btnMenu { display: inline-block; }
        header h1 { font-size: 1.1rem; }
        /* En móvil, el sidebar se oculta y aparece como panel deslizante */
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; z-index: 300;
            transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 0 0 20px rgba(0,0,0,0.25);
        }
        #sidebar.open { transform: translateX(0); }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 250; }
        #overlay.open { display: block; }
    }
</style>
</head>
<body>

    <!-- ==================== BARRA SUPERIOR FIJA (header + pestañas juntos) ====================
         Antes header y nav eran DOS elementos "sticky" independientes, cada
         uno con su propio "top" escrito a mano. Ahora viven juntos dentro de
         un solo contenedor pegajoso (#topbar) para que nunca se desincronicen. -->
    <div id="topbar">
        <header>
            <button id="btnMenu" aria-label="Abrir índice de capítulos">☰</button>
            <div>
                <h1 id="tituloCapituloActivo">Química General</h1>
                <div class="subtitle">Chang &amp; Overby, 15ª Ed.</div>
            </div>
            <div id="headerAcciones">
                <button id="btnBuscar" aria-label="Buscar (Ctrl+K)" title="Buscar (Ctrl+K)">🔍</button>
                <button id="btnLogros" aria-label="Ver logros" title="Logros">🏆</button>
                <button id="btnTema" aria-label="Cambiar a modo oscuro" title="Modo oscuro">🌙</button>
                <button id="btnQR" aria-label="Estudiar en el celular (QR)" title="Estudiar en el celular">📱</button>
            </div>
        </header>
        <nav id="main-nav">
            <button data-page="objetivos">🎯 Objetivos</button>
            <button data-page="conceptos">🧪 Conceptos</button>
            <button data-page="formulas">📐 Fórmulas</button>
            <button data-page="ejemplos">✏️ Ejemplos</button>
            <button data-page="ejercicios">📝 Ejercicios</button>
            <button data-page="test">🧠 Test</button>
            <button data-page="tarjetas">🃏 Tarjetas</button>
            <button data-page="practica">⚡ Práctica</button>
            <button data-page="resumen">📌 Resumen</button>
        </nav>
    </div>

    <!-- Fondo oscuro que aparece detrás del menú lateral cuando está abierto en móvil -->
    <div id="overlay"></div>

    <!-- ==================== MODAL "ESTUDIAR EN EL CELULAR" (QR) ====================
         Panel independiente del sistema de capítulos/pestañas. Para usarlo:
         1) Sube esta carpeta completa a un hosting gratis (ej. GitHub Pages).
         2) Pega aquí la URL pública que te dé (ej. https://tuusuario.github.io/quimica/index01.html).
         3) Se genera el QR y queda guardado en este navegador para la próxima vez. -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-box">
            <button class="qr-modal-close" id="btnCerrarQR" aria-label="Cerrar">✕</button>
            <h3>📱 Estudiar en el celular</h3>
            <p>Pega aquí la URL pública donde publicaste esta página (ej. GitHub Pages) y escanea el QR con tu iPhone.</p>
            <input type="text" id="qrUrlInput" placeholder="https://tuusuario.github.io/quimica/index01.html">
            <button class="btn" id="btnGenerarQR">Generar QR</button>
            <div id="qrResultado"></div>
        </div>
    </div>

    <!-- ==================== MODAL DE BÚSQUEDA GLOBAL (Ctrl+K) ====================
         Busca en TODOS los capítulos cargados (conceptos, fórmulas, ejemplos,
         ejercicios, preguntas de test y tarjetas) usando los mismos campos que
         ya usa el motor para dibujar cada capítulo, así que no depende de que
         capituloXX.js agregue nada nuevo. -->
    <div id="buscarModal" class="qr-modal">
        <div class="search-box">
            <input type="text" id="buscarInput" placeholder="Buscar conceptos, fórmulas, ejercicios..." autocomplete="off">
            <div id="buscarResultados"></div>
        </div>
    </div>

    <!-- ==================== MODAL DE LOGROS ==================== -->
    <div id="logrosModal" class="qr-modal">
        <div class="logros-box">
            <button class="qr-modal-close" id="btnCerrarLogros" aria-label="Cerrar">✕</button>
            <h3>🏆 Tus Logros</h3>
            <p id="logrosContador" style="font-size:0.85rem; color:var(--muted); margin-bottom:0.5rem;"></p>
            <div id="logrosGrid" class="logros-grid"></div>
        </div>
    </div>

    <!-- Notificación flotante que aparece cuando se desbloquea un logro -->
    <div id="toast"></div>

    <div class="layout">
        <!-- ==================== MENÚ LATERAL: índice de capítulos ==================== -->
        <aside id="sidebar">
            <h2>Capítulos</h2>
            <div id="listaCapitulos"><!-- Se llena dinámicamente con JS, uno por capítulo registrado --></div>
        </aside>

        <div class="content-wrap">
            <!-- Aquí el motor inyecta las 9 secciones del capítulo que esté activo -->
            <main id="main-content"></main>
        </div>
    </div>

<script>
/* ============================================================================
   MOTOR GENÉRICO DE CAPÍTULOS
   Este archivo NO contiene contenido de ningún capítulo: solo sabe cómo
   DIBUJAR los datos que cada capituloXX.js registra llamando a
   registrarCapitulo({...}). Para agregar un capítulo nuevo, nunca se toca
   este archivo: solo se agrega <script src="capituloXX.js"> antes del
   cierre de </body> (ver el final de este archivo).
   ============================================================================ */

// Arreglo global donde se acumulan todos los capítulos cargados (uno por cada
// archivo capituloXX.js que se incluya con <script src="...">).
window.CAPITULOS = window.CAPITULOS || [];

// Cada capituloXX.js llama a esta función una sola vez con todo su contenido.
function registrarCapitulo(datos) {
    window.CAPITULOS.push(datos);
}

// Número de capítulo actualmente mostrado en pantalla (null = ninguno aún).
var capituloActivo = null;

/* ==================== COLOR AUTOMÁTICO POR CAPÍTULO ====================
   En vez de definir 25-26 paletas de color a mano, calculamos un matiz (hue)
   distinto para cada número de capítulo usando el "ángulo dorado" (137.5°),
   que es la forma matemática estándar de repartir colores lo más distintos
   posible entre sí aunque haya muchos. Así el capítulo 4 nunca se parece al 5. */
function matizDeCapitulo(numero) {
    return (numero * 137.508) % 360; // grados de 0 a 360 en la rueda de color
}
function coloresDeCapitulo(numero) {
    var h = matizDeCapitulo(numero);
    return {
        primary: 'hsl(' + h + ', 45%, 32%)',
        primaryDark: 'hsl(' + h + ', 55%, 22%)',
        accent: 'hsl(' + ((h + 40) % 360) + ', 80%, 48%)',
        dot: 'hsl(' + h + ', 65%, 45%)'
    };
}
// Aplica los colores calculados como variables CSS globales (--primary, etc.)
// para que TODO el CSS de arriba (que ya usa var(--primary)) cambie de tono
// automáticamente sin tener que duplicar ni una sola regla de estilo.
function aplicarAcento(numero) {
    var c = coloresDeCapitulo(numero);
    document.documentElement.style.setProperty('--primary', c.primary);
    document.documentElement.style.setProperty('--primary-dark', c.primaryDark);
    document.documentElement.style.setProperty('--accent', c.accent);
}

/* ==================== ALTURA REAL DE LA BARRA SUPERIOR ====================
   Mide en píxeles cuánto mide de alto el bloque header+nav (#topbar) y lo
   guarda en la variable CSS --topbar-h. Así el sidebar siempre sabe
   exactamente dónde termina la barra superior, sin importar si el header
   ocupa una o dos líneas (por ejemplo en pantallas angostas). */
function ajustarAlturaTopbar() {
    var topbar = document.getElementById('topbar');
    document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
}
window.addEventListener('resize', ajustarAlturaTopbar);

/* ==================== RENDER DEL MENÚ LATERAL ==================== */
function renderSidebar() {
    // Ordena los capítulos por número (1, 2, 3...) sin importar el orden en
    // que se hayan incluido los <script> en el HTML.
    var ordenados = window.CAPITULOS.slice().sort(function(a, b) { return a.numero - b.numero; });
    var html = '';
    ordenados.forEach(function(cap) {
        var color = coloresDeCapitulo(cap.numero).dot;
        var claseActiva = (cap.numero === capituloActivo) ? ' active-chap' : '';
        html += '<button class="chap-item' + claseActiva + '" style="--chap-color:' + color + '" ' +
                'onclick="cargarCapitulo(' + cap.numero + ')">' +
                '<span class="chap-dot"></span>' +
                '<span><span class="chap-num">Cap. ' + cap.numero + '.</span> ' + cap.titulo + '</span>' +
                '</button>';
    });
    document.getElementById('listaCapitulos').innerHTML = html;
}

/* ==================== CONSTRUCCIÓN DE CADA SECCIÓN ====================
   Cada función recibe el objeto "cap" (los datos de un capítulo) y devuelve
   el HTML de una sola pestaña. Los ids generados siempre llevan el prefijo
   "c{numero}_" para que, aunque en el futuro se muestren dos capítulos a la
   vez (hoy no pasa), nunca choquen dos ids iguales. */

function idc(cap, sufijo) { return 'c' + cap.numero + '_' + sufijo; }

function seccionObjetivos(cap) {
    var items = cap.objetivos.map(function(o) { return '<li>' + o + '</li>'; }).join('');
    return '<section id="objetivos" class="active-page">' +
        '<h2>🎯 Objetivos de Aprendizaje</h2>' +
        '<p>' + (cap.objetivosIntro || 'Al finalizar este capítulo serás capaz de:') + '</p>' +
        '<ul>' + items + '</ul>' +
        '</section>';
}

function seccionConceptos(cap) {
    var subtemas = cap.conceptos.map(function(c) {
        return '<h3>' + c.titulo + '</h3>' + c.html;
    }).join('');
    var glosario = renderGlosario('Glosario de Fuentes y Citas (Conceptos)', cap.conceptosGlosario);
    return '<section id="conceptos"><h2>🧪 Conceptos Clave</h2>' + subtemas + glosario + '</section>';
}

function seccionFormulas(cap) {
    var cajas = cap.formulas.map(function(f) {
        return '<div class="formula-box">' + f.box + '<div class="vars">' + f.vars + '</div></div>' +
            '<p class="fuente-nota">Fuente: ' + f.fuente + '</p>';
    }).join('');
    var tablaHtml = '';
    if (cap.formulasTabla) {
        var t = cap.formulasTabla;
        var thead = '<tr>' + t.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
        var tbody = t.filas.map(function(fila) {
            return '<tr>' + fila.map(function(celda) { return '<td>' + celda + '</td>'; }).join('') + '</tr>';
        }).join('');
        tablaHtml = '<h3>' + t.titulo + '</h3><table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>' +
            '<p class="fuente-nota">Fuente: ' + t.fuente + '</p>';
    }
    var glosario = renderGlosario('Glosario de Fuentes (Fórmulas)', cap.formulasGlosario);
    return '<section id="formulas"><h2>📐 Fórmulas y Relaciones Clave</h2>' + cajas + tablaHtml + glosario + '</section>';
}

function seccionEjemplos(cap) {
    var cajas = cap.ejemplos.map(function(e) {
        var lineas = e.solucionLineas.map(function(l) { return '<p>' + l + '</p>'; }).join('');
        return '<div class="example-box"><h4>' + e.titulo + '</h4>' +
            '<p><strong>Problema:</strong> ' + e.problema + '</p>' +
            '<p><strong>Solución:</strong></p>' + lineas +
            '<p class="fuente-nota">Fuente: ' + e.fuente + '</p></div>';
    }).join('');
    var glosario = renderGlosario('Glosario de Fuentes (Ejemplos)', cap.ejemplosGlosario);
    return '<section id="ejemplos"><h2>✏️ Ejemplos Resueltos</h2>' + cajas + glosario + '</section>';
}

function seccionEjercicios(cap) {
    var items = cap.ejercicios.map(function(ej, i) {
        var inputId = idc(cap, 'ex' + i);
        var fbId = idc(cap, 'fb' + i);
        var tipoInput = (ej.tipo === 'numero') ? 'number' : 'text';
        var funcion = (ej.tipo === 'numero') ? 'checkExercise' : 'checkExerciseText';
        var respuestaJs = (ej.tipo === 'numero') ? ej.respuesta : "'" + ej.respuesta.replace(/'/g, "\\'") + "'";
        return '<div class="exercise-item">' +
            '<p><strong>' + (i + 1) + '.</strong> ' + ej.enunciado + '</p>' +
            '<input type="' + tipoInput + '" id="' + inputId + '" placeholder="' + (ej.placeholder || 'Respuesta') + '">' +
            '<button onclick="' + funcion + '(\'' + inputId + '\', ' + respuestaJs + ', \'' + fbId + '\')">Comprobar</button>' +
            '<div id="' + fbId + '" class="feedback" aria-live="polite"></div>' +
            '</div>';
    }).join('');
    return '<section id="ejercicios"><h2>📝 Ejercicios Interactivos</h2>' +
        '<p>Responde y haz clic en "Comprobar" para verificar tu respuesta.</p>' + items + '</section>';
}

function seccionTest(cap) {
    var items = cap.quiz.map(function(q, i) {
        var qId = i + 1;
        var contId = idc(cap, 'tq' + qId);
        var fbId = idc(cap, 'tf' + qId);
        var nombreRadio = idc(cap, 'q' + qId);
        var letras = ['a', 'b', 'c', 'd', 'e'];
        var opciones = q.opciones.map(function(op, idx) {
            return '<label><input type="radio" name="' + nombreRadio + '" value="' + letras[idx] + '"> ' + op + '</label>';
        }).join('');
        return '<div class="test-q" id="' + contId + '">' +
            '<p><strong>' + qId + '.</strong> ' + q.pregunta + '</p>' + opciones +
            '<button onclick="checkQuiz(\'' + contId + '\', \'' + nombreRadio + '\', \'' + q.correcta + '\', \'' + fbId + '\')">Verificar</button>' +
            '<div class="feedback" id="' + fbId + '" aria-live="polite"></div>' +
            '</div>';
    }).join('');
    return '<section id="test"><h2>🧠 Test de Opción Múltiple</h2>' +
        '<p>Selecciona una opción y haz clic en "Verificar".</p>' + items + '</section>';
}

function seccionTarjetas(cap) {
    var cajas = cap.flashcards.map(function(f) {
        return '<div class="flashcard-container"><div class="flashcard" onclick="this.classList.toggle(\'flipped\'); registrarFlip()">' +
            '<div class="flashcard-front"><div class="fc-content">' + f.frente + '</div></div>' +
            '<div class="flashcard-back"><div class="fc-content">' + f.dorso + '</div></div></div></div>';
    }).join('');
    return '<section id="tarjetas"><h2>🃏 Tarjetas de Memoria</h2>' +
        '<div class="cards-grid">' + cajas + '</div></section>';
}

function seccionPractica(cap) {
    return '<section id="practica"><h2>⚡ Modo Práctica — Niveles Progresivos</h2>' +
        '<p>Selecciona un nivel y responde las preguntas que se generan aleatoriamente. ¡Acumula puntos!</p>' +
        '<div class="practice-controls">' +
        '<button class="btn" onclick="setPracticeLevel(\'facil\')" style="background:var(--success);">Fácil</button>' +
        '<button class="btn" onclick="setPracticeLevel(\'medio\')" style="background:var(--accent);">Medio</button>' +
        '<button class="btn" onclick="setPracticeLevel(\'dificil\')" style="background:var(--danger);">Difícil</button>' +
        '</div>' +
        '<div class="exercise-item" style="background:var(--bg-soft);">' +
        '<span id="practiceLevelBadge" class="level-badge level-1">Nivel Fácil</span>' +
        '<p><strong>Pregunta:</strong> <span id="practiceQuestion">Selecciona un nivel para comenzar.</span></p>' +
        '<div class="practice-answer-area">' +
        '<input type="text" id="practiceAnswer" placeholder="Tu respuesta" style="width:180px;">' +
        '<button onclick="checkPractice()">Responder</button>' +
        '<span id="practiceFeedback" class="feedback" style="margin-left:0.5rem;" aria-live="polite"></span>' +
        '</div>' +
        '<p style="margin-top:0.5rem; font-size:0.9rem;">Puntuación: <span id="practiceScore">0</span> aciertos</p>' +
        '</div></section>';
}

function seccionResumen(cap) {
    var puntos = cap.resumenPuntos.map(function(p) { return '<li>' + p + '</li>'; }).join('');
    var filasErrores = cap.resumenErrores.map(function(par) {
        return '<tr><td>' + par[0] + '</td><td>' + par[1] + '</td></tr>';
    }).join('');
    var glosario = renderGlosario('Glosario Completo de Fuentes y Citas', cap.resumenGlosario);
    return '<section id="resumen"><h2>📌 Resumen del Capítulo</h2>' +
        '<ul>' + puntos + '</ul>' +
        '<h3>Tabla de Errores Frecuentes</h3>' +
        '<table><thead><tr><th>Error común</th><th>Corrección</th></tr></thead><tbody>' + filasErrores + '</tbody></table>' +
        glosario + '</section>';
}

// Función compartida para dibujar cualquier glosario (lista numerada de fuentes).
function renderGlosario(titulo, items) {
    if (!items || !items.length) return '';
    var lis = items.map(function(i) { return '<li>' + i + '</li>'; }).join('');
    return '<div class="glossary"><h4>📚 ' + titulo + '</h4><ol>' + lis + '</ol></div>';
}

/* ==================== CARGA DE UN CAPÍTULO EN PANTALLA ==================== */
function cargarCapitulo(numero) {
    var cap = window.CAPITULOS.filter(function(c) { return c.numero === numero; })[0];
    if (!cap) return;

    capituloActivo = numero;
    aplicarAcento(numero);
    document.getElementById('tituloCapituloActivo').textContent = 'Cap. ' + numero + ' — ' + cap.titulo;
    ajustarAlturaTopbar(); // el título puede cambiar de largo y afectar la altura del header

    // Construye las 9 secciones y las inserta todas juntas en <main>.
    var html = seccionObjetivos(cap) + seccionConceptos(cap) + seccionFormulas(cap) +
        seccionEjemplos(cap) + seccionEjercicios(cap) + seccionTest(cap) +
        seccionTarjetas(cap) + seccionPractica(cap) + seccionResumen(cap);
    document.getElementById('main-content').innerHTML = html;

    renderSidebar(); // vuelve a pintar el menú para marcar el capítulo activo
    cerrarMenuMovil();

    // Recuerda cuál fue la última pestaña vista DENTRO de este capítulo (o "objetivos" si es la primera vez)
    var ultimaPestana = localStorage.getItem('ultimaPestana_cap' + numero) || 'objetivos';
    mostrarPestana(ultimaPestana);

    localStorage.setItem('ultimoCapitulo', numero);

    // Prepara el Modo Práctica de este capítulo con su propio banco de preguntas.
    practicaBanco = cap.practica;
    practicaScore = 0;
    setPracticeLevel('facil');

    // Registra la visita para el sistema de logros y reinicia el conteo de
    // aciertos del Test (cada capítulo lleva su propio conteo de "perfecto").
    registrarCapituloVisitado(numero);
    testProgress[numero] = { correctas: {}, total: cap.quiz.length };
}

/* ==================== NAVEGACIÓN ENTRE PESTAÑAS ==================== */
function mostrarPestana(pageId) {
    document.querySelectorAll('main > section').forEach(function(sec) { sec.classList.remove('active-page'); });
    var target = document.getElementById(pageId);
    if (target) target.classList.add('active-page');

    document.querySelectorAll('#main-nav button').forEach(function(btn) {
        btn.classList.remove('active-nav');
        if (btn.getAttribute('data-page') === pageId) btn.classList.add('active-nav');
    });
    if (capituloActivo) localStorage.setItem('ultimaPestana_cap' + capituloActivo, pageId);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('#main-nav button').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var pageId = this.getAttribute('data-page');
        if (pageId) mostrarPestana(pageId);
    });
});

/* ==================== MENÚ LATERAL EN MÓVIL (abrir/cerrar) ==================== */
function abrirMenuMovil() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('open');
}
function cerrarMenuMovil() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
}
document.getElementById('btnMenu').addEventListener('click', abrirMenuMovil);
document.getElementById('overlay').addEventListener('click', cerrarMenuMovil);

/* ==================== MODAL "ESTUDIAR EN EL CELULAR" (QR) ====================
   Usa un servicio gratuito (api.qrserver.com) que genera la imagen del QR
   a partir de una URL, sin necesidad de instalar ninguna librería. La URL
   que el usuario pega se guarda en localStorage para no tener que
   volver a escribirla cada vez que abra el archivo. */
function generarQR() {
    var url = document.getElementById('qrUrlInput').value.trim();
    var resultado = document.getElementById('qrResultado');
    if (!url) { resultado.innerHTML = '<p style="color:var(--danger); font-size:0.85rem;">⚠️ Pega primero la URL pública de tu página.</p>'; return; }
    localStorage.setItem('qrUrlGuardada', url);
    var qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    resultado.innerHTML = '<img src="' + qrSrc + '" alt="Código QR" width="220" height="220">' +
        '<p style="font-size:0.78rem; margin-top:0.5rem;">Escanéalo con la cámara de tu iPhone.</p>';
}
function abrirModalQR() {
    var guardada = localStorage.getItem('qrUrlGuardada');
    if (guardada) {
        document.getElementById('qrUrlInput').value = guardada;
        generarQR();
    }
    document.getElementById('qrModal').classList.add('open');
}
function cerrarModalQR() {
    document.getElementById('qrModal').classList.remove('open');
}
document.getElementById('btnQR').addEventListener('click', abrirModalQR);
document.getElementById('btnCerrarQR').addEventListener('click', cerrarModalQR);
document.getElementById('btnGenerarQR').addEventListener('click', generarQR);
document.getElementById('qrModal').addEventListener('click', function(e) {
    if (e.target.id === 'qrModal') cerrarModalQR(); // clic fuera de la caja cierra el modal
});

/* ============================================================================
   MODO OSCURO
   Guarda la preferencia en localStorage con la clave 'temaOscuro' (mismo
   estilo de nombres que 'ultimoCapitulo' y 'qrUrlGuardada' que ya usa este
   archivo). Si el usuario nunca lo tocó, respeta el tema del sistema
   operativo/navegador (prefers-color-scheme).
   ============================================================================ */
function aplicarTema(esOscuro) {
    document.documentElement.setAttribute('data-theme', esOscuro ? 'dark' : 'light');
    var btn = document.getElementById('btnTema');
    btn.textContent = esOscuro ? '☀️' : '🌙';
    btn.setAttribute('aria-label', esOscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
}
function toggleTema() {
    var esOscuroAhora = document.documentElement.getAttribute('data-theme') === 'dark';
    var nuevoEsOscuro = !esOscuroAhora;
    aplicarTema(nuevoEsOscuro);
    localStorage.setItem('temaOscuro', nuevoEsOscuro ? '1' : '0');
}
function initTema() {
    var guardado = localStorage.getItem('temaOscuro');
    var esOscuro;
    if (guardado !== null) esOscuro = (guardado === '1');
    else esOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    aplicarTema(esOscuro);
}
document.getElementById('btnTema').addEventListener('click', toggleTema);

/* ============================================================================
   SISTEMA DE LOGROS
   Se activan por acciones del usuario (primer ejercicio, capítulos vistos,
   test perfecto, uso del buscador, flashcards volteadas, acierto en modo
   difícil). Todo se guarda en localStorage bajo 'quimicaLogros' /
   'quimicaEstadisticas', igual que ya hace el resto del motor con sus
   propias claves ('ultimoCapitulo', etc.), así que conviven sin chocar.
   ============================================================================ */
var LOGROS_DEF = [
    { id: 'primer_ejercicio', icono: '🎯', nombre: 'Primer Paso', desc: 'Resuelve tu primer ejercicio' },
    { id: 'test_perfecto', icono: '💯', nombre: 'Perfeccionista', desc: '100% en un Test de un capítulo' },
    { id: 'cap_1', icono: '📖', nombre: 'Iniciado', desc: 'Visita el Capítulo 1' },
    { id: 'cap_2', icono: '⚛️', nombre: 'Atómico', desc: 'Visita el Capítulo 2' },
    { id: 'buscador', icono: '🔍', nombre: 'Explorador', desc: 'Usa la búsqueda global' },
    { id: 'flash_5', icono: '🃏', nombre: 'Memorista', desc: 'Voltea 5 tarjetas de memoria' },
    { id: 'practica_dificil', icono: '🔥', nombre: 'Desafiante', desc: 'Acierta una pregunta en Nivel Difícil' }
];
var logrosDesbloqueados = JSON.parse(localStorage.getItem('quimicaLogros') || '[]');
var estadisticas = JSON.parse(localStorage.getItem('quimicaEstadisticas') || '{"ejercicios":0,"capitulosVistos":[],"flips":0}');
// Guarda, por capítulo, qué preguntas del Test ya se contestaron bien (para saber cuándo es "perfecto").
var testProgress = {};

function guardarEstadisticas() {
    localStorage.setItem('quimicaEstadisticas', JSON.stringify(estadisticas));
}
function unlock(id) {
    if (logrosDesbloqueados.indexOf(id) !== -1) return; // ya estaba desbloqueado, no repetir el aviso
    logrosDesbloqueados.push(id);
    localStorage.setItem('quimicaLogros', JSON.stringify(logrosDesbloqueados));
    var def = LOGROS_DEF.filter(function(l) { return l.id === id; })[0];
    if (def) mostrarToast('🏆 ¡Logro desbloqueado: ' + def.nombre + '!');
}
function mostrarToast(mensaje) {
    var toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 3500);
}
function registrarEjercicioCorrecto() {
    estadisticas.ejercicios++;
    if (estadisticas.ejercicios === 1) unlock('primer_ejercicio');
    guardarEstadisticas();
}
function registrarCapituloVisitado(numero) {
    if (estadisticas.capitulosVistos.indexOf(numero) === -1) {
        estadisticas.capitulosVistos.push(numero);
        guardarEstadisticas();
    }
    if (numero === 1) unlock('cap_1');
    if (numero === 2) unlock('cap_2');
}
function registrarFlip() {
    estadisticas.flips++;
    guardarEstadisticas();
    if (estadisticas.flips >= 5) unlock('flash_5');
}
// contId tiene el formato "c{numeroCapitulo}_tq{numeroPregunta}" (ver la función idc()).
function registrarAciertoTest(contId) {
    var match = contId.match(/^c(\d+)_tq(\d+)$/);
    if (!match) return;
    var numCap = parseInt(match[1], 10);
    var numPregunta = match[2];
    if (!testProgress[numCap]) return;
    testProgress[numCap].correctas[numPregunta] = true;
    var totalCorrectas = Object.keys(testProgress[numCap].correctas).length;
    if (totalCorrectas >= testProgress[numCap].total && testProgress[numCap].total > 0) {
        unlock('test_perfecto');
    }
}

function abrirModalLogros() {
    document.getElementById('logrosContador').textContent =

/* ============================================================================
   BÚSQUEDA GLOBAL (Ctrl+K)
   Recorre window.CAPITULOS (el mismo arreglo que ya llena registrarCapitulo())
   leyendo SOLO los campos que index01 ya usaba antes de este cambio
   (conceptos, formulas, ejemplos, ejercicios, quiz, flashcards,
   resumenPuntos). No depende de que capituloXX.js agregue ningún campo
   nuevo, así que es compatible con los archivos de capítulos que ya tengas.
   Al hacer clic en un resultado, carga el capítulo Y salta directo a la
   pestaña correspondiente (mejora sobre el buscador original, que solo
   abría el capítulo sin ubicar la pestaña exacta). */
function quitarEtiquetas(html) {
    return (html || '').replace(/<[^>]+>/g, '');
}
function buscarEnCapitulos(consulta) {
    var q = consulta.toLowerCase().trim();
    if (q.length < 2) return [];
    var resultados = [];
    window.CAPITULOS.forEach(function(cap) {
        (cap.conceptos || []).forEach(function(c) {
            var texto = quitarEtiquetas(c.titulo + ' ' + c.html);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'conceptos', tipo: 'Concepto', titulo: quitarEtiquetas(c.titulo), extracto: texto.substring(0, 90) });
            }
        });
        (cap.formulas || []).forEach(function(f) {
            var texto = quitarEtiquetas(f.box + ' ' + f.vars);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'formulas', tipo: 'Fórmula', titulo: texto.substring(0, 50), extracto: texto.substring(0, 90) });
            }
        });
        (cap.ejemplos || []).forEach(function(e) {
            var texto = quitarEtiquetas(e.titulo + ' ' + e.problema);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'ejemplos', tipo: 'Ejemplo', titulo: quitarEtiquetas(e.titulo), extracto: quitarEtiquetas(e.problema).substring(0, 90) });
            }
        });
        (cap.ejercicios || []).forEach(function(ej) {
            var texto = quitarEtiquetas(ej.enunciado);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'ejercicios', tipo: 'Ejercicio', titulo: texto.substring(0, 60), extracto: texto.substring(0, 90) });
            }
        });
        (cap.quiz || []).forEach(function(pr) {
            var texto = quitarEtiquetas(pr.pregunta);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'test', tipo: 'Test', titulo: texto.substring(0, 60), extracto: texto.substring(0, 90) });
            }
        });
        (cap.flashcards || []).forEach(function(f) {
            var texto = quitarEtiquetas(f.frente + ' ' + f.dorso);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'tarjetas', tipo: 'Tarjeta', titulo: quitarEtiquetas(f.frente), extracto: quitarEtiquetas(f.dorso).substring(0, 90) });
            }
        });
        (cap.resumenPuntos || []).forEach(function(p) {
            var texto = quitarEtiquetas(p);
            if (texto.toLowerCase().indexOf(q) !== -1) {
                resultados.push({ cap: cap.numero, pagina: 'resumen', tipo: 'Resumen', titulo: texto.substring(0, 60), extracto: texto.substring(0, 90) });
            }
        });
    });
    return resultados;
}
function ejecutarBusqueda() {
    var q = document.getElementById('buscarInput').value;
    var contenedor = document.getElementById('buscarResultados');
    if (q.trim().length < 2) { contenedor.innerHTML = ''; return; }
    var resultados = buscarEnCapitulos(q).slice(0, 20);
    if (!resultados.length) {
        contenedor.innerHTML = '<div class="search-vacio">Sin resultados. Prueba con otra palabra.</div>';
        return;
    }
    contenedor.innerHTML = resultados.map(function(r, idx) {
        return '<div class="search-result" onclick="irAResultado(' + idx + ')">' +
            '<div class="sr-meta">Cap. ' + r.cap + ' · ' + r.tipo + '</div>' +
            '<div class="sr-titulo">' + r.titulo + '</div>' +
            (r.extracto ? '<div class="sr-extracto">' + r.extracto + '…</div>' : '') +
            '</div>';
    }).join('');
    window._ultimaBusqueda = resultados; // guardado temporal para poder navegar al hacer clic
}
function irAResultado(idx) {
    var r = window._ultimaBusqueda[idx];
    if (!r) return;
    cargarCapitulo(r.cap);
    mostrarPestana(r.pagina);
    cerrarBuscador();
}
function abrirBuscador() {
    document.getElementById('buscarModal').classList.add('open');
    document.getElementById('buscarInput').value = '';
    document.getElementById('buscarResultados').innerHTML = '';
    setTimeout(function() { document.getElementById('buscarInput').focus(); }, 50);
    unlock('buscador'); // el logro se otorga por abrir el buscador, no hace falta encontrar algo
}
function cerrarBuscador() {
    document.getElementById('buscarModal').classList.remove('open');
}
document.getElementById('btnBuscar').addEventListener('click', abrirBuscador);
document.getElementById('buscarInput').addEventListener('input', ejecutarBusqueda);
document.getElementById('buscarModal').addEventListener('click', function(e) {
    if (e.target.id === 'buscarModal') cerrarBuscador();
});
// Atajo de teclado Ctrl+K (o Cmd+K en Mac) para abrir el buscador desde cualquier pestaña,
// y Escape para cerrar cualquiera de los tres modales (QR, buscador, logros).
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); abrirBuscador(); }
    if (e.key === 'Escape') { cerrarModalQR(); cerrarBuscador(); cerrarModalLogros(); }
});

/* ==================== CITAS TÁCTILES (tocar para ver la fuente en celular) ====================
   Se usa "delegación de eventos" sobre document en vez de enganchar cada cita
   una por una: así funciona también para el HTML que se genera dinámicamente
   al cambiar de capítulo, sin tener que reconectar nada cada vez. */
document.addEventListener('click', function(e) {
    var tag = e.target.closest('.citation-tag');
    document.querySelectorAll('.citation-tag.tooltip-active').forEach(function(t) {
        if (t !== tag) t.classList.remove('tooltip-active');
    });
    if (tag) {
        e.stopPropagation();
        tag.classList.toggle('tooltip-active');
    }
});

/* ==================== EJERCICIOS NUMÉRICOS Y DE TEXTO (genéricos) ==================== */
function checkExercise(inputId, correct, feedbackId) {
    var input = document.getElementById(inputId);
    var fb = document.getElementById(feedbackId);
    var val = parseFloat(input.value);
    if (isNaN(val)) { fb.textContent = '⚠️ Introduce un número válido.'; fb.className = 'feedback err'; return; }
    if (val === correct) { fb.textContent = '✅ ¡Correcto!'; fb.className = 'feedback ok'; registrarEjercicioCorrecto(); }
    else { fb.textContent = '❌ Incorrecto. La respuesta correcta es ' + correct + '.'; fb.className = 'feedback err'; }
}
function checkExerciseText(inputId, correct, feedbackId) {
    var input = document.getElementById(inputId);
    var fb = document.getElementById(feedbackId);
    var userVal = (input.value || '').trim().replace(/\s+/g, '');
    var correctVal = correct.replace(/\s+/g, '');
    if (userVal === '') { fb.textContent = '⚠️ Introduce una respuesta.'; fb.className = 'feedback err'; return; }
    if (userVal === correctVal) { fb.textContent = '✅ ¡Correcto!'; fb.className = 'feedback ok'; registrarEjercicioCorrecto(); }
    else { fb.textContent = '❌ Incorrecto. Revisa mayúsculas/minúsculas y subíndices (esperado: ' + correct + ').'; fb.className = 'feedback err'; }
}

/* ==================== TEST DE OPCIÓN MÚLTIPLE (genérico) ==================== */
function checkQuiz(contId, nombreRadio, correcta, fbId) {
    var container = document.getElementById(contId);
    var labels = container.querySelectorAll('label');
    var radios = container.querySelectorAll('input[name="' + nombreRadio + '"]');
    var selected = null, selectedLabel = null;
    radios.forEach(function(r, index) { if (r.checked) { selected = r.value; selectedLabel = labels[index]; } });
    var fb = document.getElementById(fbId);
    if (!selected) { fb.textContent = '⚠️ Selecciona una opción.'; fb.className = 'feedback err'; return; }
    labels.forEach(function(l) { l.classList.remove('correct-opt', 'wrong-opt', 'selected-opt'); });
    if (selectedLabel) selectedLabel.classList.add('selected-opt');
    if (selected === correcta) {
        if (selectedLabel) selectedLabel.classList.add('correct-opt');
        fb.textContent = '✅ ¡Correcto! Buena comprensión.'; fb.className = 'feedback ok';
        registrarAciertoTest(contId); // contId trae el número de capítulo y de pregunta codificados (ver idc())
    } else {
        if (selectedLabel) selectedLabel.classList.add('wrong-opt');
        labels.forEach(function(l, idx) { if (radios[idx].value === correcta) l.classList.add('correct-opt'); });
        fb.textContent = '❌ Incorrecto. La opción correcta está resaltada en verde.'; fb.className = 'feedback err';
    }
}
// Marca visualmente la opción elegida apenas se hace clic (antes de "Verificar")
document.addEventListener('change', function(e) {
    if (e.target.matches('.test-q input[type="radio"]')) {
        var container = e.target.closest('.test-q');
        container.querySelectorAll('label').forEach(function(l) { l.classList.remove('selected-opt'); });
        var parentLabel = e.target.closest('label');
        if (parentLabel) parentLabel.classList.add('selected-opt');
        var fb = container.querySelector('.feedback');
        if (fb) { fb.textContent = ''; fb.className = 'feedback'; }
    }
});

/* ==================== MODO PRÁCTICA (genérico, usa el banco del capítulo activo) ==================== */
var practicaBanco = null;
var practiceLevel = 'facil';
var practicaScore = 0;
var currentPracticeAnswer = '';
var currentPracticeTipo = 'texto';

function setPracticeLevel(level) {
    practiceLevel = level;
    var badge = document.getElementById('practiceLevelBadge');
    if (!badge) return; // por si esta sección todavía no se pintó
    var labels = {
        facil: { text: 'Nivel Fácil', clase: 'level-1' },
        medio: { text: 'Nivel Medio', clase: 'level-2' },
        dificil: { text: 'Nivel Difícil', clase: 'level-3' }
    };
    badge.textContent = labels[level].text;
    badge.className = 'level-badge ' + labels[level].clase;
    generatePracticeQuestion();
    document.getElementById('practiceFeedback').textContent = '';
    document.getElementById('practiceFeedback').className = 'feedback';
    document.getElementById('practiceAnswer').value = '';
}

function generatePracticeQuestion() {
    if (!practicaBanco) return;
    var pool = practicaBanco[practiceLevel] || practicaBanco.facil;
    var item = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('practiceQuestion').innerHTML = item.q; // puede traer <sup>/<sub>
    currentPracticeAnswer = item.a;
    currentPracticeTipo = item.tipo || 'texto';
    document.getElementById('practiceFeedback').textContent = '';
    document.getElementById('practiceFeedback').className = 'feedback';
    document.getElementById('practiceAnswer').value = '';
}

// Ignora tildes y mayúsculas al comparar texto (nunca se usa con fórmulas químicas).
function normalizarTexto(str) {
    return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '');
}

function checkPractice() {
    var input = document.getElementById('practiceAnswer');
    var feedback = document.getElementById('practiceFeedback');
    var userValCrudo = input.value || '';
    if (userValCrudo.trim() === '') { feedback.textContent = '⚠️ Introduce tu respuesta.'; feedback.className = 'feedback err'; return; }

    var isCorrect;
    if (currentPracticeTipo === 'formula') {
        var userFormula = userValCrudo.trim().replace(/\s+/g, '');
        var correctFormula = currentPracticeAnswer.trim().replace(/\s+/g, '');
        isCorrect = (userFormula === correctFormula);
    } else {
        isCorrect = (normalizarTexto(userValCrudo) === normalizarTexto(currentPracticeAnswer));
    }

    if (isCorrect) {
        feedback.textContent = '✅ ¡Correcto! +1 punto'; feedback.className = 'feedback ok'; practicaScore++;
        if (practiceLevel === 'dificil') unlock('practica_dificil');
    } else {
        feedback.textContent = '❌ Incorrecto. La respuesta correcta era: ' + currentPracticeAnswer; feedback.className = 'feedback err';
    }
    document.getElementById('practiceScore').textContent = practicaScore;
    setTimeout(generatePracticeQuestion, 1200);
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.id === 'practiceAnswer') checkPractice();
});

/* ==================== ARRANQUE DE LA APLICACIÓN ==================== */
document.addEventListener('DOMContentLoaded', function() {
    initTema();
    ajustarAlturaTopbar();
    renderSidebar();
    // Reabre el último capítulo visto, o el primero disponible si es la primera vez.
    var ultimo = parseInt(localStorage.getItem('ultimoCapitulo'), 10);
    var existeUltimo = window.CAPITULOS.some(function(c) { return c.numero === ultimo; });
    var primerCapitulo = window.CAPITULOS.slice().sort(function(a, b) { return a.numero - b.numero; })[0];
    if (existeUltimo) cargarCapitulo(ultimo);
    else if (primerCapitulo) cargarCapitulo(primerCapitulo.numero);
});
</script>
