<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Química General | Chang & Overby 15ª Ed.</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>

    <!-- ==================== BARRA SUPERIOR FIJA (header + pestañas juntos) ====================
         Antes header y nav eran DOS elementos "sticky" independientes, cada
         uno con su propio "top" escrito a mano. Ahora viven juntos dentro de
         un solo contenedor pegajoso (#topbar) para que nunca se desincronicen. -->
    <div id="topbar">
        <header>
            <button id="btnMenu" aria-label="Abrir índice de capítulos">☰</button>
            <div>
                <h1 id="tituloCapituloActivo">Química General</h1>
                <div class="subtitle">Chang &amp; Overby, 15ª Ed.</div>
            </div>
            <div id="headerAcciones">
                <button id="btnBuscar" aria-label="Buscar (Ctrl+K)" title="Buscar (Ctrl+K)">🔍</button>
                <button id="btnLogros" aria-label="Ver logros" title="Logros">🏆</button>
                <button id="btnTema" aria-label="Cambiar a modo oscuro" title="Modo oscuro">🌙</button>
                <button id="btnQR" aria-label="Estudiar en el celular (QR)" title="Estudiar en el celular">📱</button>
            </div>
        </header>
        <nav id="main-nav">
            <button data-page="objetivos">🎯 Objetivos</button>
            <button data-page="conceptos">🧪 Conceptos</button>
            <button data-page="formulas">📐 Fórmulas</button>
            <button data-page="ejemplos">✏️ Ejemplos</button>
            <button data-page="ejercicios">📝 Ejercicios</button>
            <button data-page="test">🧠 Test</button>
            <button data-page="tarjetas">🃏 Tarjetas</button>
            <button data-page="practica">⚡ Práctica</button>
            <button data-page="resumen">📌 Resumen</button>
        </nav>
    </div>

    <!-- Fondo oscuro que aparece detrás del menú lateral cuando está abierto en móvil -->
    <div id="overlay"></div>

    <!-- ==================== MODAL "ESTUDIAR EN EL CELULAR" (QR) ====================
         Panel independiente del sistema de capítulos/pestañas. Para usarlo:
         1) Sube esta carpeta completa a un hosting gratis (ej. GitHub Pages).
         2) Pega aquí la URL pública que te dé (ej. https://tuusuario.github.io/quimica/index01.html).
         3) Se genera el QR y queda guardado en este navegador para la próxima vez. -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-box">
            <button class="qr-modal-close" id="btnCerrarQR" aria-label="Cerrar">✕</button>
            <h3>📱 Estudiar en el celular</h3>
            <p>Pega aquí la URL pública donde publicaste esta página (ej. GitHub Pages) y escanea el QR con tu iPhone.</p>
            <input type="text" id="qrUrlInput" placeholder="https://tuusuario.github.io/quimica/index01.html">
            <button class="btn" id="btnGenerarQR">Generar QR</button>
            <div id="qrResultado"></div>
        </div>
    </div>

    <!-- ==================== MODAL DE BÚSQUEDA GLOBAL (Ctrl+K) ====================
         Busca en TODOS los capítulos cargados (conceptos, fórmulas, ejemplos,
         ejercicios, preguntas de test y tarjetas) usando los mismos campos que
         ya usa el motor para dibujar cada capítulo, así que no depende de que
         capituloXX.js agregue nada nuevo. -->
    <div id="buscarModal" class="qr-modal">
        <div class="search-box">
            <input type="text" id="buscarInput" placeholder="Buscar conceptos, fórmulas, ejercicios..." autocomplete="off">
            <div id="buscarResultados"></div>
        </div>
    </div>

    <!-- ==================== MODAL DE LOGROS ==================== -->
    <div id="logrosModal" class="qr-modal">
        <div class="logros-box">
            <button class="qr-modal-close" id="btnCerrarLogros" aria-label="Cerrar">✕</button>
            <h3>🏆 Tus Logros</h3>
            <p id="logrosContador" style="font-size:0.85rem; color:var(--muted); margin-bottom:0.5rem;"></p>
            <div id="logrosGrid" class="logros-grid"></div>
        </div>
    </div>

    <!-- Notificación flotante que aparece cuando se desbloquea un logro -->
    <div id="toast"></div>

    <div class="layout">
        <!-- ==================== MENÚ LATERAL: índice de capítulos ==================== -->
        <aside id="sidebar">
            <h2>Capítulos</h2>
            <div id="listaCapitulos"><!-- Se llena dinámicamente con JS, uno por capítulo registrado --></div>
        </aside>

        <div class="content-wrap">
            <!-- Aquí el motor inyecta las 9 secciones del capítulo que esté activo -->
            <main id="main-content"></main>
        </div>
    </div>


<script src="motor.js"></script>
<script src="ejercicios.js"></script>
<script src="unidades.js"></script>
<script src="componentes.js"></script>

<script src="capitulo01.js"></script>
<script src="capitulo02.js"></script>
<script src="capitulo03.js"></script>
<script src="f_capitulo01.js"></script> 
<script src="f_capitulo02.js"></script>

</body>

</html>
